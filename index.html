<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vatsal Malkan</title>
<style>
  :root {
    --bg-top: #1a1622;
    --bg-bottom: #07060a;
    --text: #cfc7d8;
    --muted: #6f6680;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 35%, var(--bg-top) 0%, var(--bg-bottom) 70%);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #stage { position: fixed; inset: 0; display: block; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    font-size: 12px; letter-spacing: .2em; color: var(--muted);
    transition: opacity .6s;
  }
  #credit {
    position: fixed; right: 8px; bottom: 8px; left: auto; max-width: calc(100% - 16px);
    font-size: 10px; color: var(--muted);
    background: rgba(7, 6, 10, .7); padding: 3px 6px; border-radius: 4px;
  }
  #credit a { color: inherit; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="loading">LOADING…</div>
<div id="credit">
  3D model: <a href="https://sketchfab.com/3d-models/futuristic-bootylicious-female-robot-e0bf22fc62064d979e114f947275684b" target="_blank" rel="noopener">"Futuristic female robot"</a>
  by <a href="https://sketchfab.com/HasanXRFX" target="_blank" rel="noopener">Syed Mohammad Hasan</a>,
  <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> (compressed)
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- renderer / scene ----------
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 50);

// Studio lighting for chrome: soft key, cool + warm rims.
scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x1a1020, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 1.6);  key.position.set(1.5, 2.5, 3);   scene.add(key);
const rimL = new THREE.DirectionalLight(0x6fe7ff, 2.2); rimL.position.set(-3, 1.5, -2); scene.add(rimL);
const rimR = new THREE.DirectionalLight(0xff7ad9, 1.6); rimR.position.set(3, 1, -2.5);  scene.add(rimR);

// ---------- head-follow (model has no rig, so twist vertices above the neck) ----------
const headUniforms = {
  uNeckY:  { value: 0 },    // height where the twist starts
  uBlend:  { value: 0.1 },  // height over which it fades in
  uPivot:  { value: new THREE.Vector3() },
  uYaw:    { value: 0 },
  uPitch:  { value: 0 },
};

function addHeadTwist(material) {
  material.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, headUniforms);
    const fn = /* glsl */`
      uniform float uNeckY, uBlend, uYaw, uPitch;
      uniform vec3 uPivot;
      mat3 headRot(float w) {
        float y = uYaw * w, p = uPitch * w;
        mat3 ry = mat3(cos(y),0.,-sin(y), 0.,1.,0., sin(y),0.,cos(y));
        mat3 rx = mat3(1.,0.,0., 0.,cos(p),sin(p), 0.,-sin(p),cos(p));
        return ry * rx;
      }`;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\n' + fn)
      .replace('#include <beginnormal_vertex>', `
        #include <beginnormal_vertex>
        float hw = smoothstep(uNeckY, uNeckY + uBlend, position.y);
        mat3 hr = headRot(hw);
        objectNormal = hr * objectNormal;
        #ifdef USE_TANGENT
          objectTangent = hr * objectTangent;
        #endif`)
      .replace('#include <begin_vertex>', `
        #include <begin_vertex>
        transformed = uPivot + hr * (transformed - uPivot);`);
  };
}

// ---------- load ----------
const rig = new THREE.Group();   // idle motion goes here
scene.add(rig);
let model = null, bounds = null;

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
loader.load('assets/robot.glb', (gltf) => {
  gltf.scene.updateMatrixWorld(true);
  const meshes = [];
  gltf.scene.traverse((o) => { if (o.isMesh) meshes.push(o); });
  const getters = ['getX', 'getY', 'getZ', 'getW'];
  meshes.forEach((o) => {
    // Bake transforms + dequantize so the shader works in plain model units.
    const g = o.geometry;
    for (const name of ['position', 'normal', 'tangent']) {
      const a = g.getAttribute(name);
      if (!a) continue;
      const out = new Float32Array(a.count * a.itemSize);
      for (let i = 0; i < a.count; i++)
        for (let c = 0; c < a.itemSize; c++) out[i * a.itemSize + c] = a[getters[c]](i);
      g.setAttribute(name, new THREE.BufferAttribute(out, a.itemSize));
    }
    g.applyMatrix4(o.matrixWorld);
    o.position.set(0, 0, 0); o.rotation.set(0, 0, 0); o.scale.set(1, 1, 1);
    o.parent.remove(o);
    model = o;
  });

  const m = model.material;
  m.envMapIntensity = 1.2;
  addHeadTwist(m);

  // Hips sit at y = 0, centred on x/z.
  model.geometry.computeBoundingBox();
  bounds = model.geometry.boundingBox.clone();
  const c = bounds.getCenter(new THREE.Vector3());
  model.geometry.translate(-c.x, -bounds.min.y, -c.z);
  model.geometry.computeBoundingBox();
  bounds = model.geometry.boundingBox.clone();
  rig.add(model);

  const h = bounds.max.y;
  headUniforms.uNeckY.value = h * 0.80;
  headUniforms.uBlend.value = h * 0.06;
  headUniforms.uPivot.value.set(0, h * 0.80, 0);

  frame();
  document.getElementById('loading').style.opacity = 0;
}, undefined, (err) => {
  document.getElementById('loading').textContent = 'COULD NOT LOAD MODEL';
  console.error(err);
});

// ---------- framing: hips at the bottom edge, head in the upper third ----------
function frame() {
  const w = innerWidth, hgt = innerHeight;
  renderer.setSize(w, hgt, false);
  camera.aspect = w / hgt;
  if (!bounds) { camera.updateProjectionMatrix(); return; }
  const H = bounds.max.y;
  const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
  // Fit height (plus headroom) or width, whichever is tighter.
  const fitH = (H * 1.12) / 2 / Math.tan(halfFov);
  const fitW = (bounds.max.x - bounds.min.x) * 1.3 / 2 / (Math.tan(halfFov) * camera.aspect);
  const dist = Math.max(fitH, fitW);
  // Hips always sit on the bottom edge of the screen (on tall phones the
  // free space ends up above her, not below).
  const lookY = dist * Math.tan(halfFov) - H * 0.01;
  camera.position.set(0, lookY, dist);
  camera.lookAt(0, lookY, 0);
  camera.updateProjectionMatrix();
}
addEventListener('resize', frame);
frame();

// ---------- input: she looks at the pointer ----------
const pointer = new THREE.Vector2(0, 0);   // -1..1
addEventListener('pointermove', (e) => {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -((e.clientY / innerHeight) * 2 - 1));
});

// ---------- animate ----------
const clock = new THREE.Clock();
let yaw = 0, pitch = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Idle: slow breathing bob and a lazy sway.
  rig.position.y = Math.sin(t * 1.1) * 0.006;
  rig.rotation.y = Math.sin(t * 0.35) * 0.06;
  rig.rotation.z = Math.sin(t * 0.5) * 0.008;

  // Head eases toward the pointer (limited range so the neck stays believable).
  const k = 1 - Math.exp(-4 * (dt || 0.016));
  yaw   += (pointer.x * 0.45 - yaw) * k;
  pitch += (-pointer.y * 0.22 - pitch) * k;
  headUniforms.uYaw.value = yaw - rig.rotation.y;
  headUniforms.uPitch.value = pitch;

  renderer.render(scene, camera);
});
</script>
</body>
</html>
