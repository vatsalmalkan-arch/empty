<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vatsal Malkan</title>
<style>
  :root {
    --bg-top: #1a1622;
    --bg-bottom: #07060a;
    --text: #cfc7d8;
    --muted: #6f6680;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 35%, var(--bg-top) 0%, var(--bg-bottom) 70%);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #stage { position: fixed; inset: 0; display: block; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    font-size: 12px; letter-spacing: .2em; color: var(--muted);
    transition: opacity .6s;
  }
  #credit {
    position: fixed; right: 8px; bottom: 8px; left: auto; max-width: calc(100% - 16px);
    font-size: 10px; color: var(--muted);
    background: rgba(7, 6, 10, .7); padding: 3px 6px; border-radius: 4px;
  }
  #credit a { color: inherit; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="loading">LOADING…</div>
<div id="credit">
  3D model: <a href="https://sketchfab.com/3d-models/futuristic-bootylicious-female-robot-e0bf22fc62064d979e114f947275684b" target="_blank" rel="noopener">"Futuristic female robot"</a>
  by <a href="https://sketchfab.com/HasanXRFX" target="_blank" rel="noopener">Syed Mohammad Hasan</a>,
  <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> (compressed)
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- renderer / scene ----------
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 50);

// Studio lighting for chrome: soft key, cool + warm rims.
scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x1a1020, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 1.6);  key.position.set(1.5, 2.5, 3);   scene.add(key);
const rimL = new THREE.DirectionalLight(0x6fe7ff, 2.2); rimL.position.set(-3, 1.5, -2); scene.add(rimL);
const rimR = new THREE.DirectionalLight(0xff7ad9, 1.6); rimR.position.set(3, 1, -2.5);  scene.add(rimR);

// ---------- load ----------
const rig = new THREE.Group();   // idle motion goes here
scene.add(rig);
let model = null, bounds = null;

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
loader.load('assets/robot.glb', (gltf) => {
  gltf.scene.updateMatrixWorld(true);
  const meshes = [];
  gltf.scene.traverse((o) => { if (o.isMesh) meshes.push(o); });
  const getters = ['getX', 'getY', 'getZ', 'getW'];
  meshes.forEach((o) => {
    // Bake transforms + dequantize so the shader works in plain model units.
    const g = o.geometry;
    for (const name of ['position', 'normal', 'tangent']) {
      const a = g.getAttribute(name);
      if (!a) continue;
      const out = new Float32Array(a.count * a.itemSize);
      for (let i = 0; i < a.count; i++)
        for (let c = 0; c < a.itemSize; c++) out[i * a.itemSize + c] = a[getters[c]](i);
      g.setAttribute(name, new THREE.BufferAttribute(out, a.itemSize));
    }
    g.applyMatrix4(o.matrixWorld);
    o.position.set(0, 0, 0); o.rotation.set(0, 0, 0); o.scale.set(1, 1, 1);
    o.parent.remove(o);
    model = o;
  });

  const m = model.material;
  m.envMapIntensity = 1.2;

  // Hips sit at y = 0, centred on x/z.
  model.geometry.computeBoundingBox();
  bounds = model.geometry.boundingBox.clone();
  const c = bounds.getCenter(new THREE.Vector3());
  model.geometry.translate(-c.x, -bounds.min.y, -c.z);
  model.geometry.computeBoundingBox();
  bounds = model.geometry.boundingBox.clone();
  model = buildSkeleton(model);
  rig.add(model);

  frame();
  document.getElementById('loading').style.opacity = 0;
}, undefined, (err) => {
  document.getElementById('loading').textContent = 'COULD NOT LOAD MODEL';
  console.error(err);
});

// ---------- skeleton (built in code; the model ships without a rig) ----------
// Joint positions measured from the mesh (hips at y = 0, model height ~1.90,
// +x is her left as seen from the front camera, +z faces the camera).
const JOINTS = {
  hips:  [0, 0.00, -0.03],
  spine: [0, 0.55, -0.03],
  chest: [0, 0.95, -0.04],
  neck:  [0, 1.37, -0.04],
  head:  [0, 1.49, -0.03],
  top:   [0, 1.90, -0.03],
  shoulder: [0.33, 1.28, -0.08],
  elbow:    [0.40, 0.88, -0.085],
  wrist:    [0.60, 0.43, -0.05],
  fingers:  [0.56, 0.00, -0.06],
};
const bones = {};

function buildSkeleton(mesh) {
  const v = (name, side = 1) => {
    const [x, y, z] = JOINTS[name];
    return new THREE.Vector3(x * side, y, z);
  };
  // Bone list; the index is the skin index.
  const defs = [
    ['hips',  null,    v('hips')],
    ['spine', 'hips',  v('spine')],
    ['chest', 'spine', v('chest')],
    ['neck',  'chest', v('neck')],
    ['head',  'neck',  v('head')],
  ];
  for (const [side, s] of [['R', 1], ['L', -1]]) {
    defs.push(
      ['upperArm' + side, 'chest',          v('shoulder', s)],
      ['foreArm' + side,  'upperArm' + side, v('elbow', s)],
      ['hand' + side,     'foreArm' + side,  v('wrist', s)],
    );
  }
  const list = [], world = {};
  for (const [name, parent, pos] of defs) {
    const b = new THREE.Bone();
    b.name = name;
    world[name] = pos;
    if (parent) { b.position.copy(pos).sub(world[parent]); bones[parent].add(b); }
    else b.position.copy(pos);
    bones[name] = b;
    list.push(b);
  }
  const idx = Object.fromEntries(list.map((b, i) => [b.name, i]));

  // --- skin weights ---
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const lerpTable = (xs, ys, x) => {
    if (x <= xs[0]) return ys[0];
    for (let i = 1; i < xs.length; i++) if (x <= xs[i]) {
      const t = (x - xs[i - 1]) / (xs[i] - xs[i - 1]);
      return ys[i - 1] + (ys[i] - ys[i - 1]) * t;
    }
    return ys[ys.length - 1];
  };
  // Below the shoulders the arms are separate from the body: this is the |x|
  // that splits arm from torso/thigh at each height (from mesh slices).
  const gapY = [0.00, 0.15, 0.30, 0.50, 0.70, 0.90, 0.97];
  const gapX = [0.41, 0.42, 0.43, 0.38, 0.29, 0.26, 0.26];

  const seg = new THREE.Line3(), tmp = new THREE.Vector3(), p = new THREE.Vector3();
  const armSegs = (s) => [
    [v('shoulder', s), v('elbow', s)],
    [v('elbow', s), v('wrist', s)],
    [v('wrist', s), v('fingers', s)],
  ];
  const segsBySide = { R: armSegs(1), L: armSegs(-1) };

  const pos = mesh.geometry.getAttribute('position');
  const n = pos.count;
  const skinIndex = new Uint16Array(n * 4), skinWeight = new Float32Array(n * 4);

  for (let i = 0; i < n; i++) {
    p.fromBufferAttribute(pos, i);
    const ax = Math.abs(p.x), side = p.x >= 0 ? 'R' : 'L';
    const w = new Map();
    const add = (name, val) => { if (val > 1e-4) w.set(idx[name], (w.get(idx[name]) || 0) + val); };

    // How much this vertex belongs to the arm chain vs the torso chain.
    let arm;
    if (p.y < 0.97) arm = ax > lerpTable(gapY, gapX, p.y) ? 1 : 0;
    else arm = smooth(0.24, 0.33, ax) * (1 - smooth(1.30, 1.40, p.y));

    // Torso chain: blend by height.
    const torso = 1 - arm;
    if (torso > 0) {
      const y = p.y;
      const hipsW  = 1 - smooth(0.45, 0.65, y);
      const chestIn = smooth(0.85, 1.05, y);
      const neckIn = smooth(1.33, 1.40, y);
      const headIn = smooth(1.46, 1.52, y);
      const parts = {
        hips: hipsW,
        spine: (1 - hipsW) * (1 - chestIn),
        chest: chestIn * (1 - neckIn),
        neck: neckIn * (1 - headIn),
        head: headIn,
      };
      for (const k in parts) add(k, parts[k] * torso);
    }

    // Arm chain: inverse distance to each bone segment, so joints blend.
    if (arm > 0) {
      const segs = segsBySide[side];
      const names = ['upperArm', 'foreArm', 'hand'];
      const raw = segs.map(([a, b]) => {
        seg.set(a, b);
        seg.closestPointToPoint(p, true, tmp);
        return 1 / Math.pow(tmp.distanceTo(p) + 0.02, 6);
      });
      const sum = raw.reduce((s, x) => s + x, 0);
      raw.forEach((r, k) => add(names[k] + side, (r / sum) * arm));
    }

    // Keep the 4 strongest influences, normalised.
    const top = [...w.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4);
    const total = top.reduce((s, [, x]) => s + x, 0) || 1;
    top.forEach(([bi, x], k) => { skinIndex[i * 4 + k] = bi; skinWeight[i * 4 + k] = x / total; });
  }
  mesh.geometry.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndex, 4));
  mesh.geometry.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeight, 4));

  const skinned = new THREE.SkinnedMesh(mesh.geometry, mesh.material);
  skinned.add(bones.hips);
  skinned.updateMatrixWorld(true);
  skinned.bind(new THREE.Skeleton(list));
  skinned.frustumCulled = false;   // bounds change as she moves
  window.robotBones = bones;       // handy for tweaking poses from the console
  return skinned;
}

// ---------- framing: hips at the bottom edge, head in the upper third ----------
function frame() {
  const w = innerWidth, hgt = innerHeight;
  renderer.setSize(w, hgt, false);
  camera.aspect = w / hgt;
  if (!bounds) { camera.updateProjectionMatrix(); return; }
  const H = bounds.max.y;
  const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
  // Fit height (plus headroom) or width, whichever is tighter.
  const fitH = (H * 1.12) / 2 / Math.tan(halfFov);
  const fitW = (bounds.max.x - bounds.min.x) * 1.3 / 2 / (Math.tan(halfFov) * camera.aspect);
  const dist = Math.max(fitH, fitW);
  // Hips always sit on the bottom edge of the screen (on tall phones the
  // free space ends up above her, not below).
  const lookY = dist * Math.tan(halfFov) - H * 0.01;
  camera.position.set(0, lookY, dist);
  camera.lookAt(0, lookY, 0);
  camera.updateProjectionMatrix();
}
addEventListener('resize', frame);
frame();

// ---------- animate ----------
// Idle loop on the skeleton: breathing, weight shift, small head tilts and a
// slow "judging" tilt every few seconds. Set window.rigTest = true to
// exaggerate everything (used to check the skin weights).
function idle(t) {
  const k = window.rigTest ? 6 : 1;
  const breathe = Math.sin(t * 1.3);
  const judge = Math.pow(Math.max(0, Math.sin(t * 0.32)), 6);   // slow pulse, rests at 0

  bones.hips.rotation.z  = Math.sin(t * 0.45) * 0.012 * k;
  bones.spine.rotation.z = -Math.sin(t * 0.45) * 0.010 * k;
  bones.spine.rotation.x = breathe * 0.006 * k;
  bones.chest.rotation.x = -breathe * 0.012 * k;
  bones.neck.rotation.x  = breathe * 0.006 * k;

  bones.head.rotation.z = (Math.sin(t * 0.6) * 0.03 + judge * 0.16) * k;
  bones.head.rotation.x = (Math.sin(t * 0.43 + 1) * 0.025 - judge * 0.05) * k;
  bones.head.rotation.y = Math.sin(t * 0.27) * 0.06 * k;

  for (const [s, dir] of [['R', 1], ['L', -1]]) {
    const phase = s === 'R' ? 0 : 1.7;
    bones['upperArm' + s].rotation.z = dir * (0.015 + Math.sin(t * 0.5 + phase) * 0.012 + breathe * 0.004) * k;
    bones['upperArm' + s].rotation.x = Math.sin(t * 0.37 + phase) * 0.015 * k;
    bones['foreArm' + s].rotation.x  = (-0.02 - Math.sin(t * 0.5 + phase) * 0.02) * k;
    bones['hand' + s].rotation.z     = dir * Math.sin(t * 0.7 + phase) * 0.04 * k;
  }
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();

  if (bones.head && !window.rigFreeze) idle(t);

  renderer.render(scene, camera);
});
</script>
</body>
</html>
