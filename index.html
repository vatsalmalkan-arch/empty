<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LGPSM — Future Forward Fashion</title>
<meta name="description" content="Pure white minimal futuristic fashion website interface.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Michroma&family=Orbitron:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one full-viewport composition. Particle bust full-bleed behind (z-0),
     header and hero UI above (z-10/z-20), drawers on the right. White page, black ink. */
  :root {
    color-scheme: light;
    --white: #ffffff;
    --ink: #000000;
    --gray-200: #e5e7eb; --gray-300: #d1d5db; --gray-400: #9ca3af;
    --gray-500: #6b7280; --gray-600: #4b5563;
    --slate: #64748b;
    --emerald: #34d399;

    --pad-x: clamp(1.25rem, 4.5vw, 5rem);
    --pad-y: clamp(1rem, 3vh, 4rem);
    --header-pt: clamp(1.25rem, 2.5vh, 2.5rem);
    --gap-nav: clamp(1rem, 2.2vw, 2.25rem);
    --logo: clamp(1.35rem, 1.2vw + 0.9rem, 2.1rem);
    --logo-deg: clamp(0.65rem, 0.4vw + 0.45rem, 0.9rem);
    --nav: clamp(0.65rem, 0.35vw + 0.5rem, 0.875rem);
    --headline: clamp(2.15rem, 4.5vw + 0.75rem, 5.25rem);
    --body: clamp(0.7rem, 0.35vw + 0.55rem, 0.9rem);
    --micro: clamp(0.55rem, 0.25vw + 0.45rem, 0.7rem);
    --btn-px: clamp(1.15rem, 1.4vw, 1.75rem);
    --btn-py: clamp(0.6rem, 0.9vh, 0.85rem);
    --btn-gap: clamp(0.75rem, 1vw, 1.1rem);
    --feature-pad: clamp(1rem, 1.5vw, 1.75rem);
    --feature-min: clamp(13rem, 18vw, 20rem);
    --globe: clamp(2.25rem, 2.5vw + 1rem, 3.25rem);
    --checker-w: clamp(2.75rem, 4.5vw, 6.5rem);
    --checker-h: clamp(1.35rem, 2.2vw, 3rem);
    --corner: clamp(0.65rem, 0.4vw + 0.4rem, 0.95rem);
    --icon: clamp(1rem, 0.6vw + 0.7rem, 1.35rem);
    --drawer-pad: clamp(1.25rem, 2.5vw, 2.25rem);
    --drawer-max: clamp(18rem, 28vw, 28rem);
    --section-gap: clamp(0.75rem, 1.5vh, 1.5rem);
    --main-py: clamp(1.25rem, 4vh, 4rem);
  }
  * { box-sizing: border-box; }
  .font-orbitron { font-family: 'Orbitron', ui-sans-serif, system-ui, sans-serif; }
  .font-jakarta { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--white); color: var(--ink);
    font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  ::selection { background: var(--ink); color: var(--white); }
  button { font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  [hidden] { display: none !important; }
  button:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

  .page { min-height: 100%; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }

  /* ---- background: particle bust + parallax grid (desktop) ---- */
  #bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #grid { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.10; pointer-events: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: var(--micro); letter-spacing: .3em; color: var(--gray-500); pointer-events: none; transition: opacity .6s; }

  /* UI layers float above the bust but let the pointer through to it */
  header, main { position: relative; pointer-events: none; }
  header a, header button, main button, .feature { pointer-events: auto; }

  /* ---- header ---- */
  header {
    z-index: 20; display: flex; align-items: center; justify-content: space-between;
    padding-inline: var(--pad-x); padding-top: var(--header-pt); padding-bottom: var(--section-gap);
  }
  .logo { display: inline-flex; align-items: flex-start; font-weight: 900; letter-spacing: .15em; font-size: var(--logo); line-height: 1; transition: opacity .2s; }
  .logo:hover { opacity: .8; }
  .logo sup { font-size: var(--logo-deg); margin-top: -0.125rem; margin-left: 0.125rem; line-height: 1; }
  nav { display: flex; align-items: center; gap: var(--gap-nav); font-size: var(--nav); font-weight: 500; text-transform: uppercase; letter-spacing: .2em; }
  nav button { transition: opacity .2s; }
  nav button:hover { opacity: .5; }
  nav .divider { color: var(--gray-300); }
  .icon { width: var(--icon); height: var(--icon); stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .bag { position: relative; }
  .badge { position: absolute; top: -0.5rem; right: -0.6rem; min-width: 1rem; height: 1rem; padding: 0 .25rem; border-radius: 999px; background: var(--ink); color: var(--white); font-size: 0.6rem; letter-spacing: 0; display: grid; place-items: center; }

  /* ---- hero ---- */
  main {
    z-index: 10; flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: var(--section-gap);
    padding-inline: var(--pad-x); padding-block: var(--main-py);
  }
  .lead { display: flex; flex-direction: column; justify-content: center; gap: var(--section-gap); }
  .corner { width: var(--corner); height: var(--corner); stroke: var(--ink); stroke-width: 1.5; fill: none; display: block; }
  h1 {
    margin: 0; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; line-height: 1.05;
    font-size: var(--headline); text-wrap: balance;
  }
  h1 span { display: block; }
  .checker { width: var(--checker-w); height: var(--checker-h); display: inline-block; margin-left: .35em; transform: translateY(2px); vertical-align: baseline; }
  .cta {
    align-self: flex-start; display: inline-flex; align-items: center; gap: var(--btn-gap);
    border: 1px solid var(--gray-400); border-radius: .375rem; text-transform: uppercase; letter-spacing: .18em;
    font-size: var(--body); font-weight: 600; padding: var(--btn-py) var(--btn-px);
    transition: background .25s, color .25s, border-color .25s; background: var(--white);
  }
  .cta .icon { width: 1em; height: 1em; transition: transform .25s; }
  .cta:hover { background: var(--ink); color: var(--white); border-color: var(--ink); }
  .cta:hover .icon { transform: translate(2px, -2px); }

  .feature { position: relative; align-self: flex-start; min-width: var(--feature-min); padding: var(--feature-pad); display: flex; flex-direction: column; gap: .9rem; }
  .feature .corner { position: absolute; }
  .feature .tl { top: 0; left: 0; } .feature .tr { top: 0; right: 0; }
  .feature .bl { bottom: 0; left: 0; } .feature .br { bottom: 0; right: 0; }
  .globe { width: var(--globe); height: var(--globe); stroke: var(--ink); stroke-width: 1.2; fill: none; }
  .tagline { margin: 0; font-size: var(--body); font-weight: 600; text-transform: uppercase; letter-spacing: .18em; line-height: 1.5; }

  .credit { position: relative; z-index: 10; text-align: center; font-size: var(--micro); color: var(--gray-500); padding: 0 var(--pad-x) .6rem; pointer-events: auto; }
  .credit a { color: inherit; }

  @media (min-width: 1024px) {
    .page { height: 100%; }
    main { flex-direction: row; align-items: stretch; }
    .feature { align-self: flex-end; }
    #bust-frame { display: none; }
  }
  /* below lg: bust moves into a bordered frame under the hero */
  @media (max-width: 1023.98px) {
    #bg { position: relative; inset: auto; z-index: 0; margin: 0 var(--pad-x) var(--section-gap); border: 1px solid var(--gray-200); aspect-ratio: 4 / 5; max-width: calc(100% - 2 * var(--pad-x)); }
    #grid { display: none; }
    #stage { touch-action: pan-y; }
  }
  @media (min-width: 640px) and (max-width: 1023.98px) { #bg { aspect-ratio: 16 / 9; } }

  /* ---- drawers ---- */
  .backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.2); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 50; width: 100%; max-width: var(--drawer-max);
    background: var(--white); border-left: 1px solid var(--gray-200); padding: var(--drawer-pad);
    padding-bottom: calc(var(--drawer-pad) + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: var(--section-gap);
    transform: translateX(100%); transition: transform .35s cubic-bezier(.2,.7,.2,1);
  }
  .drawer.open { transform: none; }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; }
  .drawer-head h2 { margin: 0; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: clamp(1rem, 0.8vw + 0.7rem, 1.35rem); }
  .drawer-sub { margin: 0; font-size: var(--micro); text-transform: uppercase; letter-spacing: .2em; color: var(--gray-500); }
  .drawer-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-height: 0; }
  .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--gray-200); }
  .row:first-child { border-top: 1px solid var(--gray-200); }
  .row .meta { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
  .tag { font-size: var(--micro); color: var(--gray-500); text-transform: uppercase; letter-spacing: .2em; }
  .row-title { font-size: var(--body); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
  .row-title.orb { font-family: 'Orbitron', ui-sans-serif, system-ui, sans-serif; font-weight: 700; letter-spacing: .1em; }
  .row-text { font-size: var(--body); color: var(--gray-600); line-height: 1.5; }
  .price { font-size: var(--body); font-variant-numeric: tabular-nums; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: .5rem; flex-shrink: 0; }
  .small-btn { border: 1px solid var(--gray-300); border-radius: .3rem; padding: .35rem .7rem; font-size: var(--micro); letter-spacing: .2em; text-transform: uppercase; font-weight: 600; transition: background .2s, color .2s, border-color .2s; }
  .small-btn:hover { background: var(--ink); color: var(--white); border-color: var(--ink); }
  .link-btn { font-size: var(--micro); letter-spacing: .15em; text-transform: uppercase; color: var(--gray-500); text-decoration: underline; text-underline-offset: 3px; }
  .link-btn:hover { color: var(--ink); }
  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8rem; color: var(--gray-500); font-size: var(--body); }
  .empty .icon { width: 2rem; height: 2rem; }
  .drawer-foot { font-size: var(--micro); color: var(--gray-500); text-align: center; text-transform: uppercase; letter-spacing: .15em; }
  .checkout { width: 100%; display: flex; align-items: center; justify-content: center; gap: .5rem; background: var(--ink); color: var(--white); padding: .95rem 1rem; border-radius: .375rem; text-transform: uppercase; letter-spacing: .2em; font-size: var(--body); font-weight: 600; }
  .checkout .icon { width: 1em; height: 1em; }
  .total { display: flex; justify-content: space-between; font-size: var(--body); text-transform: uppercase; letter-spacing: .15em; padding: .25rem 0 .75rem; font-variant-numeric: tabular-nums; }

  /* ---- toast ---- */
  .toast {
    position: fixed; z-index: 60; top: calc(1rem + env(safe-area-inset-top, 0px)); right: max(1rem, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; gap: .6rem; max-width: min(24rem, calc(100% - 2rem));
    background: var(--ink); color: var(--white); padding: .8rem 1rem; border-radius: .375rem; font-size: var(--body);
    opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast .icon { color: var(--emerald); width: 1rem; height: 1rem; flex-shrink: 0; }

  @media (prefers-reduced-motion: reduce) { .drawer, .toast, .backdrop, .cta, .cta .icon { transition: none; } }
</style>
</head>

<div class="page">
  <header>
    <button class="logo font-orbitron" id="logo" aria-label="LGPSM home">LGPSM<sup>˚</sup></button>
    <nav aria-label="Main">
      <button data-open="shop">Shop</button>

      <button data-open="journal">Journal</button>

    <svg id="grid" aria-hidden="true"><defs><pattern id="gridp" width="48" height="48" patternUnits="userSpaceOnUse"><path id="gridpath" d="M 48 0 L 0 0 0 48" fill="none" stroke="#64748b" stroke-width="0.6"/></pattern></defs><rect width="100%" height="100%" fill="url(#gridp)"/></svg>

  <div class="credit">
    Bust: <a href="https://sketchfab.com/3d-models/stargazing-through-the-attic-window-6b3e2a011f024ac6a6b123ed33d0ec28" target="_blank" rel="noopener">"Stargazing through the attic window"</a>

    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title">

    <h2 class="font-orbitron" id="drawer-title"></h2>
    <button id="drawer-close" aria-label="Close"><svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>

  <div class="drawer-body" id="drawer-body"></div>
  <div id="drawer-foot"></div>

  <svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span id="toast-text"></span>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- settings ----------
const MODEL_URL = 'assets/girl.glb';
const MODEL_YAW = window.__yaw ?? 0;
const MODEL_PITCH = window.__pitch ?? 0.25;   // she looks up at the sky; tilt her face toward us
const BUDGET = { face: 0.38, hair: 0.42, body: 0.20 };   // share of particles per part
const COUNT   = innerWidth < 700 ? 50000 : 100000;  // particles
const CROP_Y  = 0.0;      // drop points below this height (model is normalised to height 1)
const POINT_SIZE = 5.2;   // bigger, overlapping beads: dense but not solid

// ---------- renderer / scene ----------
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 50);
const bust = new THREE.Group();
scene.add(bust);

let baseSize = 1;
let points = null, bounds = null, base = null, nrm = null, off = null, clump = null;

// ---------- load + sample ----------
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
loader.load(MODEL_URL, (gltf) => {
  gltf.scene.updateMatrixWorld(true);

  // Bake every mesh into one geometry (position + normal only, plain floats)
  // so we can sample the whole figure at once.
  const getters = ['getX', 'getY', 'getZ', 'getW'];
  const parts = [];
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    const src = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry;
    const g = new THREE.BufferGeometry();
    for (const name of ['position', 'normal']) {
      const a = src.getAttribute(name);
      if (!a) continue;
      const out = new Float32Array(a.count * 3);
      for (let i = 0; i < a.count; i++)
        for (let c = 0; c < 3; c++) out[i * 3 + c] = a[getters[c]](i);
      g.setAttribute(name, new THREE.BufferAttribute(out, 3));
    }
    if (!g.getAttribute('normal')) g.computeVertexNormals();
    g.applyMatrix4(o.matrixWorld);
    g.userData.group = /face|pSphere/i.test(o.name) ? 'face' : /hair/i.test(o.name) ? 'hair' : 'body';
    parts.push(g);
  });

  // Normalise all parts the same way: bottom at y = 0, centred, height 1,
  // then turn and tilt her to face the camera.
  const all = mergeGeometries(parts);
  all.computeBoundingBox();
  const size = all.boundingBox.getSize(new THREE.Vector3());
  const c = all.boundingBox.getCenter(new THREE.Vector3());
  const M = new THREE.Matrix4()
    .multiply(new THREE.Matrix4().makeRotationX(MODEL_PITCH))
    .multiply(new THREE.Matrix4().makeRotationY(MODEL_YAW))
    .multiply(new THREE.Matrix4().makeScale(1 / size.y, 1 / size.y, 1 / size.y))
    .multiply(new THREE.Matrix4().makeTranslation(-c.x, -all.boundingBox.min.y, -c.z));
  parts.forEach((g) => g.applyMatrix4(M));

  // Sample each group with its own budget so the dense hair strands
  // don't drown out the face.
  const p = new THREE.Vector3(), n = new THREE.Vector3();
  const posArr = new Float32Array(COUNT * 3), nrmArr = new Float32Array(COUNT * 3), rnd = new Float32Array(COUNT);
  let k = 0;
  for (const [group, share] of Object.entries(BUDGET)) {
    const gs = parts.filter((g) => g.userData.group === group);
    if (!gs.length) continue;
    const sampler = new MeshSurfaceSampler(new THREE.Mesh(mergeGeometries(gs))).build();
    const target = Math.min(COUNT, k + Math.round(COUNT * share));
    let guard = 0;
    while (k < target && guard++ < COUNT * 20) {
      sampler.sample(p, n);
      if (p.y < CROP_Y) continue;
      posArr.set([p.x, p.y, p.z], k * 3);
      nrmArr.set([n.x, n.y, n.z], k * 3);
      rnd[k] = Math.random();
      k++;
    }
  }

  // Centre the bust: its bottom at y = 0.
  let minY = Infinity, maxY = -Infinity, maxX = 0;
  for (let i = 0; i < k; i++) {
    const y = posArr[i * 3 + 1];
    minY = Math.min(minY, y); maxY = Math.max(maxY, y); maxX = Math.max(maxX, Math.abs(posArr[i * 3]));
  }
  for (let i = 0; i < k; i++) posArr[i * 3 + 1] -= minY;
  bounds = { h: maxY - minY, w: maxX * 2 };

  const geo = new THREE.BufferGeometry();
  base = posArr.slice(0, k * 3);
  nrm = nrmArr.slice(0, k * 3);
  off = new Float32Array(k * 3);
  // Clumps: neighbouring grains share a random "stickiness" so the surface
  // tears and dents in chunks, like kinetic sand.
  clump = new Float32Array(k);
  for (let i = 0; i < k; i++) {
    const cx = Math.floor(base[i * 3] * 38), cy = Math.floor(base[i * 3 + 1] * 38), cz = Math.floor(base[i * 3 + 2] * 38);
    const hsh = Math.sin(cx * 127.1 + cy * 311.7 + cz * 74.7) * 43758.5453;
    clump[i] = 0.45 + (hsh - Math.floor(hsh)) * 1.1;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(base.slice(), 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  geo.setAttribute('aRnd', new THREE.BufferAttribute(rnd.slice(0, k), 1));
  geo.setAttribute('aDent', new THREE.BufferAttribute(new Float32Array(k), 1).setUsage(THREE.DynamicDrawUsage));

  points = new THREE.Points(geo, makeMaterial());
  points.frustumCulled = false;
  bust.add(points);
  // turn around her middle, not her base
  points.position.y = -bounds.h / 2;
  bust.position.y = bounds.h / 2;

  frame();
  document.getElementById('loading').style.opacity = 0;
}, undefined, (err) => {
  document.getElementById('loading').textContent = 'COULD NOT LOAD MODEL';
  console.error(err);
});

// ---------- material: glossy dark beads ----------
const NOISE = /* glsl */`
  // 3D simplex noise (Ashima Arts / Stefan Gustavson, MIT)
  vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
  vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
  float snoise(vec3 v){
    const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
    vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
    vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
    vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
    i=mod289(i);
    vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
    float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
    vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
    vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
    vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
    vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
    vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
    vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
    vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
    p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
    vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
    return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
  }`;

function makeMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime:   { value: 0 },
      uSize:   { value: 1 },
      uHeight: { value: 1 },
      uInk:    { value: new THREE.Color('#0b0b0d') },
      uSheen:  { value: new THREE.Color('#8e939c') },
      uHot:    { value: new THREE.Color('#9ca3af') },
    },
    vertexShader: /* glsl */`
      uniform float uTime, uSize, uHeight;
      attribute float aRnd, aDent;
      varying vec3 vNormalV;
      varying float vDent, vY, vRnd;
      ${NOISE}
      void main() {
        vec3 p = position;
        // barely-there breathing so she never looks frozen
        p += normal * snoise(p * 3.0 + vec3(0.0, uTime * 0.12, 0.0)) * 0.003;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vNormalV = normalize(normalMatrix * normal);
        vDent = aDent; vY = position.y / uHeight; vRnd = aRnd;
        gl_PointSize = uSize * (0.55 + aRnd * 0.9) / -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uInk, uSheen, uHot;
      varying vec3 vNormalV;
      varying float vDent, vY, vRnd;
      void main() {
        vec2 c = gl_PointCoord * 2.0 - 1.0;
        float r2 = dot(c, c);
        if (r2 > 1.0) discard;
        vec3 bead = vec3(c.x, -c.y, sqrt(1.0 - r2));
        vec3 n = normalize(vNormalV * 1.6 + bead);
        vec3 L = normalize(vec3(-0.4, 0.6, 0.7));
        float diff = max(dot(n, L), 0.0);
        float spec = pow(max(dot(reflect(-L, n), vec3(0.0, 0.0, 1.0)), 0.0), 28.0);
        float rim = pow(1.0 - max(vNormalV.z, 0.0), 2.5);
        vec3 col = uInk + uSheen * (diff * 0.34 + rim * 0.6) + vec3(spec) * 1.1;
        // freshly worked sand looks a little lighter, then settles
        col = mix(col, uHot, clamp(vDent, 0.0, 1.0) * 0.35);
        float fadeIn = smoothstep(0.0, 0.14, vY);
        if (fadeIn < 0.999 && vRnd > fadeIn) discard;
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
}

// ---------- framing ----------
function frame() {
  const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  if (bounds) {
    const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
    const fitH = bounds.h * 1.08 / 2 / Math.tan(halfFov);
    const fitW = bounds.w * (camera.aspect < 0.8 ? 1.1 : 1.6) / 2 / (Math.tan(halfFov) * camera.aspect);
    const dist = Math.max(fitH, fitW);
    const lookY = dist * Math.tan(halfFov) - bounds.h * 0.02;   // bottom of bust on the screen edge
    camera.position.set(0, lookY, dist);
    camera.lookAt(0, lookY, 0);
    baseSize = POINT_SIZE * renderer.getPixelRatio() * (h / 900) * (COUNT < 80000 ? 1.35 : 1);
    points.material.uniforms.uHeight.value = bounds.h;
  }
  camera.updateProjectionMatrix();
}
addEventListener('resize', frame);
frame();

// ---------- interaction ----------
// Mouse: hover to push the sand away, drag to turn her, scroll to resize.
// Touch: one finger pushes, two fingers turn her, pinch to resize.
const BRUSH   = 0.085;   // brush radius (model is height 1)
const REPEL   = 1.8;     // how hard grains are pushed away from the cursor
const LIFT    = 0.8;     // how much they also pop out toward you
const SMEAR   = 1.4;     // how far sand is dragged along with the motion
const SETTLE  = 0.55;    // how fast dents slump back (per second)
const MAX_OFF = 0.12;    // never pull a grain further than this

const ndc = new THREE.Vector2(9, 9);
let sculpting = false;
const touches = new Map();
let dragging = false, lastDrag = null;
let yaw = 0, pitch = 0, yawVel = 0, pitchVel = 0;
let zoom = 1, zoomTarget = 1, pinchDist = 0;
const ZOOM_MIN = 0.55, ZOOM_MAX = 2.4;
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomTarget = THREE.MathUtils.clamp(zoomTarget * Math.exp(-e.deltaY * 0.0012), ZOOM_MIN, ZOOM_MAX);
}, { passive: false });
function touchSpread() {
  const [a, b] = [...touches.values()];
  return Math.hypot(a.x - b.x, a.y - b.y);
}

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (e.pointerType === 'mouse') { dragging = true; sculpting = false; lastDrag = { x: e.clientX, y: e.clientY }; }
  else if (touches.size >= 2) { dragging = true; sculpting = false; lastDrag = centroid(); pinchDist = touchSpread(); }
  else { setNdc(e); sculpting = true; }
});
canvas.addEventListener('pointermove', (e) => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (dragging) {
    if (e.pointerType !== 'mouse' && touches.size >= 2) {
      const s = touchSpread();
      if (pinchDist > 0) zoomTarget = THREE.MathUtils.clamp(zoomTarget * s / pinchDist, ZOOM_MIN, ZOOM_MAX);
      pinchDist = s;
    }
    const pt = e.pointerType === 'mouse' ? { x: e.clientX, y: e.clientY } : centroid();
    const dx = pt.x - lastDrag.x, dy = pt.y - lastDrag.y;
    lastDrag = pt;
    yawVel = dx * 0.006; pitchVel = dy * 0.004;
    yaw += yawVel; pitch = THREE.MathUtils.clamp(pitch + pitchVel, -0.6, 0.6);
    canvas.style.cursor = 'grabbing';
    return;
  }
  setNdc(e);
  sculpting = e.pointerType === 'mouse' || touches.size === 1;
});
const endPointer = (e) => {
  touches.delete(e.pointerId);
  if (e.pointerType === 'mouse') { dragging = false; canvas.style.cursor = 'grab'; }
  else if (touches.size < 2) { dragging = false; sculpting = touches.size === 1; }
  if (e.pointerType !== 'mouse' && touches.size === 0) sculpting = false;
};
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && !dragging) sculpting = false; });
canvas.style.cursor = 'grab';
function setNdc(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}
function centroid() {
  let x = 0, y = 0; for (const t of touches.values()) { x += t.x; y += t.y; }
  return { x: x / touches.size, y: y / touches.size };
}

// ---------- sculpt + render loop ----------
const clock = new THREE.Clock();
const ray = new THREE.Raycaster(), inv = new THREE.Matrix4();
const o = new THREE.Vector3(), d = new THREE.Vector3(), brush = new THREE.Vector3(), lastBrush = new THREE.Vector3(), move = new THREE.Vector3();
let haveLast = false, settling = 0;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  const t = clock.elapsedTime;

  if (points) {
    // turning: follow the drag, then glide to a stop
    if (!dragging) {
      yaw += yawVel; pitch = THREE.MathUtils.clamp(pitch + pitchVel, -0.6, 0.6);
      yawVel *= Math.pow(0.92, dt * 60); pitchVel *= Math.pow(0.92, dt * 60);
    }
    bust.rotation.set(pitch, yaw, 0);
    zoom += (zoomTarget - zoom) * (1 - Math.exp(-dt * 10));
    bust.scale.setScalar(zoom);
    points.material.uniforms.uSize.value = baseSize * Math.sqrt(zoom);   // stay dense when enlarged
    bust.updateMatrixWorld();

    // pointer ray in her own space
    let active = false;
    if (sculpting && !dragging) {
      ray.setFromCamera(ndc, camera);
      inv.copy(points.matrixWorld).invert();
      const r = ray.ray.clone().applyMatrix4(inv);
      o.copy(r.origin); d.copy(r.direction).normalize();
      // brush centre: where the ray passes closest to her middle
      brush.copy(o).addScaledVector(d, -o.clone().sub(new THREE.Vector3(0, bounds.h * 0.5, 0)).dot(d));
      move.copy(brush).sub(lastBrush);
      if (!haveLast || move.length() > 0.2) move.set(0, 0, 0);
      lastBrush.copy(brush); haveLast = true;
      active = true;
    } else haveLast = false;

    if (active || settling > 0) {
      const pos = points.geometry.attributes.position.array;
      const dent = points.geometry.attributes.aDent.array;
      const n = base.length / 3;
      const keep = Math.exp(-SETTLE * dt);
      const brushR = BRUSH / zoom;                        // same size on screen at any zoom
      const R2 = (brushR * 1.7) ** 2;
      let maxOff = 0;
      for (let i = 0; i < n; i++) {
        const j = i * 3;
        let ox = off[j] * keep, oy = off[j + 1] * keep, oz = off[j + 2] * keep;
        // loose sand slumps a touch as it settles
        oy -= (Math.abs(ox) + Math.abs(oz)) * 0.25 * dt;

        if (active) {
          const px = base[j] + ox, py = base[j + 1] + oy, pz = base[j + 2] + oz;
          const vx = px - o.x, vy = py - o.y, vz = pz - o.z;
          const along = vx * d.x + vy * d.y + vz * d.z;
          const r2 = vx * vx + vy * vy + vz * vz - along * along;     // distance to the ray, squared
          const nx = nrm[j], ny = nrm[j + 1], nz = nrm[j + 2];
          const facing = -(nx * d.x + ny * d.y + nz * d.z);          // only the side facing you
          if (r2 < R2 && facing > 0) {
            // uneven, wobbling brush edge so the push never looks circular
            const wob = 0.75 + 0.45 * Math.sin(px * 41 + py * 23 + t * 1.7) * Math.sin(pz * 37 - py * 29 + t * 1.1);
            const dist = Math.sqrt(r2) + 1e-5;
            const rr = dist / (brushR * wob);
            if (rr < 1) {
              // shove the grain straight away from the cursor (sideways to your
              // view), a little toward you, and along with the cursor's motion
              const rx = vx - along * d.x, ry = vy - along * d.y, rz = vz - along * d.z;
              const f = (1 - rr) * (1 - rr) * clump[i] * facing * dt * 6;
              ox += (rx / dist * REPEL * 0.06 - d.x * LIFT * 0.02 + move.x * SMEAR) * f;
              oy += (ry / dist * REPEL * 0.06 - d.y * LIFT * 0.02 + move.y * SMEAR) * f;
              oz += (rz / dist * REPEL * 0.06 - d.z * LIFT * 0.02 + move.z * SMEAR) * f;
            }
          }
        }
        const m = Math.abs(ox) + Math.abs(oy) + Math.abs(oz);
        if (m > MAX_OFF) { const s = MAX_OFF / m; ox *= s; oy *= s; oz *= s; }
        off[j] = ox; off[j + 1] = oy; off[j + 2] = oz;
        pos[j] = base[j] + ox; pos[j + 1] = base[j + 1] + oy; pos[j + 2] = base[j + 2] + oz;
        dent[i] = Math.min(1, m * 30);
        if (m > maxOff) maxOff = m;
      }
      points.geometry.attributes.position.needsUpdate = true;
      points.geometry.attributes.aDent.needsUpdate = true;
      settling = maxOff > 1e-4 ? 1 : 0;
    }
    points.material.uniforms.uTime.value = t;
  }
  renderer.render(scene, camera);
});
</script>
<script>
// ---------- UI: checkerboard, drawers, bag, toasts, grid parallax ----------
(() => {
  // checkerboard: 4 rows of 3.8 squares, even rows shifted by 2.25
  const chk = document.getElementById('checker');
  let sq = '';
  for (let r = 0; r < 4; r++) {
    const shift = r % 2 === 0 ? 2.25 : 0;
    for (let x = shift; x + 3.8 <= 36.01; x += 4.5) sq += `<rect x="${x.toFixed(2)}" y="${(r * 4.5 + 0.35).toFixed(2)}" width="3.8" height="3.8"/>`;
  }
  chk.innerHTML = sq;

  const SHOP = [
    { tag: 'Limited edition', title: 'Cyber-Tex Overcoat', price: 850 },
    { tag: 'New drop', title: 'Geo-Mesh Tech Hoodie', price: 320 },
    { tag: 'In stock', title: 'Orbital Tapered Trousers', price: 290 },
    { tag: 'Pre-order', title: 'Modular All-Weather Vest', price: 410 },
  ];
  const COLLECTIONS = [
    { tag: 'Series 01', title: 'Synthetic Horizons', text: 'Ultra-durable weather-sealed fabrics with minimalist silhouette architecture.' },
    { tag: 'Series 02', title: 'Kinetic Form', text: 'Ergonomic streetwear designed for maximum mobility and temperature equilibrium.' },
    { tag: 'Series 03', title: 'Monochrome Zero', text: 'Pure black and white structural tailoring crafted from 100% recycled polymers.' },
  ];
  const JOURNAL = [
    { tag: 'Aug 2026', title: 'The Architecture of Next-Gen Textiles', read: '4 min read' },
    { tag: 'Jul 2026', title: 'Circular Design in High-End Apparel', read: '6 min read' },
    { tag: 'Jun 2026', title: 'Minimalism as a Functional Statement', read: '3 min read' },
  ];
  const ICON_BAG = '<svg class="icon" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>';
  const ICON_CHEV = '<svg class="icon" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>';
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const money = (n) => '$' + n.toLocaleString('en-US');

  const cart = [];
  const $ = (id) => document.getElementById(id);
  const drawer = $('drawer'), backdrop = $('backdrop');
  let current = null;

  const FOOT = '<p class="drawer-foot">LGPSM © 2026 — Future Forward Fashion</p>';
  function render(kind) {
    const body = $('drawer-body'), foot = $('drawer-foot');
    if (kind === 'shop') {
      $('drawer-title').textContent = 'Catalog'; $('drawer-sub').textContent = 'Featured Garments';
      body.innerHTML = SHOP.map((it, i) => `
        <div class="row"><div class="meta"><span class="tag">${esc(it.tag)}</span><span class="row-title">${esc(it.title)}</span></div>
        <div class="side"><span class="price">${money(it.price)}</span><button class="small-btn" data-add="${i}">Add</button></div></div>`).join('');
      foot.innerHTML = FOOT;
    } else if (kind === 'collections') {
      $('drawer-title').textContent = 'Archive 2026'; $('drawer-sub').textContent = 'Season Lineup';
      body.innerHTML = COLLECTIONS.map((it) => `
        <div class="row"><div class="meta"><span class="tag">${esc(it.tag)}</span><span class="row-title orb">${esc(it.title)}</span><span class="row-text">${esc(it.text)}</span></div></div>`).join('');
      foot.innerHTML = FOOT;
    } else if (kind === 'journal') {
      $('drawer-title').textContent = 'Editorial'; $('drawer-sub').textContent = 'Latest Dispatches';
      body.innerHTML = JOURNAL.map((it) => `
        <div class="row"><div class="meta"><span class="tag">${esc(it.tag)}</span><span class="row-title">${esc(it.title)}</span><span class="tag">${esc(it.read)}</span></div></div>`).join('');
      foot.innerHTML = FOOT;
    } else if (kind === 'cart') {
      $('drawer-title').textContent = 'Shopping Bag';
      $('drawer-sub').textContent = cart.length ? `${cart.length} item${cart.length > 1 ? 's' : ''}` : '';
      if (!cart.length) {
        body.innerHTML = `<div class="empty">${ICON_BAG}<span>Your shopping bag is empty.</span></div>`;
        foot.innerHTML = FOOT;
      } else {
        body.innerHTML = cart.map((it, i) => `
          <div class="row"><div class="meta"><span class="row-title">${esc(it.title)}</span><span class="price">${money(it.price)}</span></div>
          <div class="side"><button class="link-btn" data-remove="${i}">Remove</button></div></div>`).join('');
        const total = cart.reduce((s, it) => s + it.price, 0);
        foot.innerHTML = `<div class="total"><span>Total</span><span>${money(total)}</span></div><button class="checkout" id="checkout">Checkout now ${ICON_CHEV}</button>`;
      }
    }
  }
  function open(kind) {
    current = kind; render(kind);
    drawer.classList.add('open'); backdrop.classList.add('open'); drawer.setAttribute('aria-hidden', 'false');
    $('drawer-close').focus({ preventScroll: true });
  }
  function close() {
    current = null;
    drawer.classList.remove('open'); backdrop.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true');
  }
  function updateBadge() {
    const b = $('badge'); b.textContent = cart.length; b.hidden = cart.length === 0;
  }
  let toastTimer = 0;
  function toast(msg) {
    $('toast-text').textContent = msg; $('toast').classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 3000);
  }

  document.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', () => open(b.dataset.open)));
  $('logo').addEventListener('click', close);
  $('drawer-close').addEventListener('click', close);
  backdrop.addEventListener('click', close);
  addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  drawer.addEventListener('click', (e) => {
    const add = e.target.closest('[data-add]'), rem = e.target.closest('[data-remove]');
    if (add) { const it = SHOP[+add.dataset.add]; cart.push(it); updateBadge(); toast(`Added "${it.title.toUpperCase()}" to your shopping bag.`); }
    else if (rem) { cart.splice(+rem.dataset.remove, 1); updateBadge(); render('cart'); }
    else if (e.target.closest('#checkout')) { cart.length = 0; updateBadge(); close(); toast('Order submitted successfully!'); }
  });

  // parallax grid (desktop): cell size and eased offset follow the cursor
  const pat = $('gridp'), path = $('gridpath');
  let cell = 0;
  function sizeGrid() {
    cell = Math.round(Math.min(64, Math.max(36, innerWidth * 0.028)));
    pat.setAttribute('width', cell); pat.setAttribute('height', cell);
    path.setAttribute('d', `M ${cell} 0 L 0 0 0 ${cell}`);
  }
  sizeGrid(); addEventListener('resize', sizeGrid);
  const mouse = { x: innerWidth / 2, y: innerHeight / 2 }, smooth = { ...mouse }, offG = { x: 0, y: 0 };
  addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
  (function tick() {
    smooth.x += (mouse.x - smooth.x) * 0.1; smooth.y += (mouse.y - smooth.y) * 0.1;
    const cx = smooth.x / innerWidth - 0.5, cy = smooth.y / innerHeight - 0.5;
    offG.x += (cx * 16 - offG.x) * 0.06; offG.y += (cy * 16 - offG.y) * 0.06;
    pat.setAttribute('x', offG.x.toFixed(2)); pat.setAttribute('y', offG.y.toFixed(2));
    requestAnimationFrame(tick);
  })();
})();
</script>
