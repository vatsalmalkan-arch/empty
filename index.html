<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vatsal Malkan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter+Tight:wght@400;500&display=swap">
<style>
  /* Layout: one full-bleed stage. Pixel headline behind a particle bust, small caption bottom-left. */
  :root {
    color-scheme: dark;
    --bg: #050407;
    --headline: #c9c4d3;
    --text: #e9e5f0;
    --muted: #8a8496;
    --chip: #1b1922;
    --font-pixel: "Silkscreen", ui-monospace, "SF Mono", Menlo, monospace;
    --font-body: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  #headline {
    position: fixed; left: 0; right: 0; top: 9vh; margin: 0;
    font-family: var(--font-pixel); font-weight: 400;
    font-size: 10vw; line-height: 1; letter-spacing: -0.02em;
    color: var(--headline); text-align: center; white-space: nowrap;
    user-select: none; pointer-events: none;
  }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #caption {
    position: fixed; left: max(20px, env(safe-area-inset-left, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    max-width: min(320px, calc(100% - 40px));
    font-family: var(--font-body); pointer-events: none;
  }
  #caption .tags { display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  #caption .chip { background: var(--chip); color: var(--text); padding: 4px 9px; border-radius: 6px; }
  #caption p { margin: 0; font-size: 17px; line-height: 1.3; }
  #caption p + p { color: var(--muted); }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 11px var(--font-pixel); letter-spacing: .2em; color: var(--muted);
    transition: opacity .6s; pointer-events: none;
  }
  #credit {
    position: fixed; right: max(8px, env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    font: 10px var(--font-body); color: var(--muted);
  }
  #credit a { color: inherit; }
  @media (max-width: 600px) {
    #credit { display: none; }
    #caption { bottom: auto; top: calc(9vh + 15vw); }
  }
</style>
</head>
<body>
<h1 id="headline">HELLO I'M VATSAL</h1>
<canvas id="stage"></canvas>
<div id="caption">
  <div class="tags"><span class="chip">AI/ML engineer</span><span>Rajkot, Gujarat</span></div>
  <p>I build models</p>
  <p>and the evals that check them.</p>
</div>
<div id="loading">LOADING</div>
<div id="credit">
  Shape sampled from <a href="https://sketchfab.com/3d-models/futuristic-bootylicious-female-robot-e0bf22fc62064d979e114f947275684b" target="_blank" rel="noopener">"Futuristic female robot"</a>
  by <a href="https://sketchfab.com/HasanXRFX" target="_blank" rel="noopener">Syed Mohammad Hasan</a>,
  <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

// ---------- settings ----------
const COUNT   = innerWidth < 700 ? 45000 : 90000;  // particles
const CROP_Y  = 0.95;     // keep everything above this height (model units): chest up
const RADIUS  = 0.11;     // cursor influence radius
const PUSH    = 2.2;      // how hard the cursor shoves
const SPRING  = 11.0;     // pull back to the shape
const DAMPING = 0.88;     // per frame at 60 fps

// ---------- renderer / scene ----------
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 50);
const bust = new THREE.Group();
scene.add(bust);

let points = null, base = null, off = null, vel = null, bounds = null;

// ---------- load + sample ----------
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
loader.load('assets/robot.glb', (gltf) => {
  gltf.scene.updateMatrixWorld(true);
  let mesh = null;
  gltf.scene.traverse((o) => { if (o.isMesh && !mesh) mesh = o; });

  // Dequantize + bake transforms so we sample in plain model units.
  const g = mesh.geometry;
  const getters = ['getX', 'getY', 'getZ', 'getW'];
  for (const name of ['position', 'normal']) {
    const a = g.getAttribute(name);
    const out = new Float32Array(a.count * a.itemSize);
    for (let i = 0; i < a.count; i++)
      for (let c = 0; c < a.itemSize; c++) out[i * a.itemSize + c] = a[getters[c]](i);
    g.setAttribute(name, new THREE.BufferAttribute(out, a.itemSize));
  }
  for (const name of Object.keys(g.attributes)) if (name !== 'position' && name !== 'normal') g.deleteAttribute(name);
  g.applyMatrix4(mesh.matrixWorld);
  g.computeBoundingBox();
  const c = g.boundingBox.getCenter(new THREE.Vector3());
  g.translate(-c.x, -g.boundingBox.min.y, -c.z);
  const sampleMesh = new THREE.Mesh(g);

  // Sample the surface, keep the bust region only.
  const sampler = new MeshSurfaceSampler(sampleMesh).build();
  const p = new THREE.Vector3(), n = new THREE.Vector3();
  const posArr = new Float32Array(COUNT * 3), nrmArr = new Float32Array(COUNT * 3), rnd = new Float32Array(COUNT);
  let k = 0, guard = 0;
  while (k < COUNT && guard++ < COUNT * 20) {
    sampler.sample(p, n);
    if (p.y < CROP_Y) continue;
    posArr.set([p.x, p.y, p.z], k * 3);
    nrmArr.set([n.x, n.y, n.z], k * 3);
    rnd[k] = Math.random();
    k++;
  }

  // Centre the bust: its bottom at y = 0.
  let minY = Infinity, maxY = -Infinity, maxX = 0;
  for (let i = 0; i < k; i++) {
    const y = posArr[i * 3 + 1];
    minY = Math.min(minY, y); maxY = Math.max(maxY, y); maxX = Math.max(maxX, Math.abs(posArr[i * 3]));
  }
  for (let i = 0; i < k; i++) posArr[i * 3 + 1] -= minY;
  bounds = { h: maxY - minY, w: maxX * 2 };

  base = posArr.slice(0, k * 3);
  off = new Float32Array(k * 3);
  vel = new Float32Array(k * 3);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(posArr.slice(0, k * 3), 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('normal', new THREE.BufferAttribute(nrmArr.slice(0, k * 3), 3));
  geo.setAttribute('aRnd', new THREE.BufferAttribute(rnd.slice(0, k), 1));
  geo.setAttribute('aOff', new THREE.BufferAttribute(new Float32Array(k), 1).setUsage(THREE.DynamicDrawUsage));

  points = new THREE.Points(geo, makeMaterial());
  points.frustumCulled = false;
  bust.add(points);

  frame();
  document.getElementById('loading').style.opacity = 0;
}, undefined, (err) => {
  document.getElementById('loading').textContent = 'COULD NOT LOAD MODEL';
  console.error(err);
});

// ---------- particle material ----------
function makeMaterial() {
  return new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: true,
    uniforms: {
      uTime:  { value: 0 },
      uSize:  { value: 1 },
      uHeight: { value: 1 },
      uLight: { value: new THREE.Color('#efeaff') },
      uShade: { value: new THREE.Color('#5d5677') },
      uGlow:  { value: new THREE.Color('#e9f2a8') },
    },
    vertexShader: /* glsl */`
      uniform float uTime, uSize, uHeight;
      attribute float aRnd, aOff;
      varying float vLit, vRnd, vY, vOff;
      void main() {
        vec3 p = position;
        // faint shimmer so the cloud never looks frozen
        p += normal * sin(uTime * 2.0 + aRnd * 40.0) * 0.0025;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vec3 nv = normalize(normalMatrix * normal);
        vec3 L = normalize(vec3(-0.35, 0.55, 0.75));
        vLit = clamp(dot(nv, L) * 0.75 + 0.35 + pow(1.0 - abs(nv.z), 3.0) * 0.35, 0.0, 1.0);
        vRnd = aRnd; vY = position.y / uHeight; vOff = aOff;
        gl_PointSize = uSize * (0.75 + aRnd * 0.6) / -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uLight, uShade, uGlow;
      varying float vLit, vRnd, vY, vOff;
      void main() {
        vec2 c = gl_PointCoord - 0.5;
        if (dot(c, c) > 0.25) discard;
        vec3 col = mix(uShade, uLight, vLit);
        // warm glow rising from the bottom edge
        float glow = 1.0 - smoothstep(0.0, 0.35, vY);
        col = mix(col, uGlow, glow * 0.55);
        // disturbed grains flash brighter
        col += vOff * 0.6;
        float a = smoothstep(0.0, 0.12, vY) * (0.75 + vRnd * 0.25);
        gl_FragColor = vec4(col, a);
      }`,
  });
}

// ---------- framing ----------
function frame() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  if (bounds) {
    const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
    const fitH = bounds.h * 1.25 / 2 / Math.tan(halfFov);
    const fitW = bounds.w * (camera.aspect < 0.8 ? 1.1 : 1.6) / 2 / (Math.tan(halfFov) * camera.aspect);
    const dist = Math.max(fitH, fitW);
    const lookY = dist * Math.tan(halfFov) - bounds.h * 0.02;   // bottom of bust on the screen edge
    camera.position.set(0, lookY, dist);
    camera.lookAt(0, lookY, 0);
    points.material.uniforms.uSize.value = 3.0 * renderer.getPixelRatio() * (h / 900) * (COUNT < 60000 ? 1.25 : 1);
    points.material.uniforms.uHeight.value = bounds.h;
  }
  camera.updateProjectionMatrix();
}
addEventListener('resize', () => { frame(); fitHeadline(); });
frame();

// Scale the headline so it spans ~94% of the width in whatever font loaded.
const headline = document.getElementById('headline');
function fitHeadline() {
  headline.style.fontSize = '100px';
  const w = headline.scrollWidth || 1;
  headline.style.fontSize = Math.min(240, (innerWidth * 0.94 / w) * 100) + 'px';
}
fitHeadline();
document.fonts?.ready.then(fitHeadline);

// ---------- pointer (mouse or touch) ----------
const ndc = new THREE.Vector2(9, 9);
const mouse = new THREE.Vector3(99, 99, 0), lastMouse = new THREE.Vector3(99, 99, 0);
const mouseVel = new THREE.Vector3();
let pointerActive = false;
const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -0.1);
function setPointer(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  pointerActive = true;
}
addEventListener('pointermove', setPointer);
addEventListener('pointerdown', setPointer);
addEventListener('pointerleave', () => { pointerActive = false; });
addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') pointerActive = false; });

// ---------- simulate + render ----------
const clock = new THREE.Clock();
const inv = new THREE.Matrix4(), hit = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  const t = clock.elapsedTime;

  if (points) {
    // slow idle turn
    bust.rotation.y = Math.sin(t * 0.25) * 0.18;
    bust.updateMatrixWorld();

    // cursor position in the bust's own space
    if (pointerActive) {
      ray.setFromCamera(ndc, camera);
      inv.copy(bust.matrixWorld).invert();
      const local = ray.ray.clone().applyMatrix4(inv);
      if (local.intersectPlane(plane, hit)) mouse.copy(hit);
    } else mouse.set(99, 99, 0);
    mouseVel.subVectors(mouse, lastMouse).divideScalar(Math.max(dt, 1e-3));
    if (mouseVel.length() > 20) mouseVel.set(0, 0, 0);          // ignore jumps
    lastMouse.copy(mouse);

    const pos = points.geometry.attributes.position.array;
    const flash = points.geometry.attributes.aOff.array;
    const n = base.length / 3;
    const damp = Math.pow(DAMPING, dt * 60);
    const R2 = RADIUS * RADIUS;
    for (let i = 0; i < n; i++) {
      const j = i * 3;
      let ox = off[j], oy = off[j + 1], oz = off[j + 2];
      let vx = vel[j], vy = vel[j + 1], vz = vel[j + 2];
      const px = base[j] + ox, py = base[j + 1] + oy;
      const dx = px - mouse.x, dy = py - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < R2) {
        const d = Math.sqrt(d2) + 1e-4, f = (1 - d / RADIUS) * PUSH * dt;
        vx += (dx / d) * f + mouseVel.x * f * 0.05;
        vy += (dy / d) * f + mouseVel.y * f * 0.05;
        vz += f * 0.6;
        const sp = Math.hypot(vx, vy, vz);
        if (sp > 1.5) { vx *= 1.5 / sp; vy *= 1.5 / sp; vz *= 1.5 / sp; }
      }
      // spring home, with a little gravity while loose so it falls like sand
      const loose = Math.min(1, Math.abs(ox) + Math.abs(oy) + Math.abs(oz));
      vx += -ox * SPRING * dt;
      vy += -oy * SPRING * dt - loose * 0.6 * dt;
      vz += -oz * SPRING * dt;
      vx *= damp; vy *= damp; vz *= damp;
      ox += vx * dt; oy += vy * dt; oz += vz * dt;
      off[j] = ox; off[j + 1] = oy; off[j + 2] = oz;
      vel[j] = vx; vel[j + 1] = vy; vel[j + 2] = vz;
      pos[j] = base[j] + ox; pos[j + 1] = base[j + 1] + oy; pos[j + 2] = base[j + 2] + oz;
      flash[i] = Math.min(1, loose * 8);
    }
    points.geometry.attributes.position.needsUpdate = true;
    points.geometry.attributes.aOff.needsUpdate = true;
    points.material.uniforms.uTime.value = t;
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
