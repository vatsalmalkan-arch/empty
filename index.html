<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vatsal Malkan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter+Tight:wght@400;500&display=swap">
<style>
  /* Layout: one full-bleed stage. Pixel headline behind a liquid particle bust, small caption bottom-left. */
  :root {
    color-scheme: dark;
    --bg: #050407;
    --headline: #c9c4d3;
    --text: #e9e5f0;
    --muted: #8a8496;
    --chip: #1b1922;
    --font-pixel: "Silkscreen", ui-monospace, "SF Mono", Menlo, monospace;
    --font-body: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  #headline {
    position: fixed; left: 0; right: 0; top: 9vh; margin: 0;
    font-family: var(--font-pixel); font-weight: 400;
    font-size: 10vw; line-height: 1; letter-spacing: -0.02em;
    color: var(--headline); text-align: center; white-space: nowrap;
    user-select: none; pointer-events: none;
  }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #caption {
    position: fixed; left: max(20px, env(safe-area-inset-left, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    max-width: min(320px, calc(100% - 40px));
    font-family: var(--font-body); pointer-events: none;
  }
  #caption .tags { display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  #caption .chip { background: var(--chip); color: var(--text); padding: 4px 9px; border-radius: 6px; }
  #caption p { margin: 0; font-size: 17px; line-height: 1.3; }
  #caption p + p { color: var(--muted); }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 11px var(--font-pixel); letter-spacing: .2em; color: var(--muted);
    transition: opacity .6s; pointer-events: none;
  }
  #credit {
    position: fixed; right: max(8px, env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    font: 10px var(--font-body); color: var(--muted);
  }
  #credit a { color: inherit; }
  @media (max-width: 600px) {
    #credit { display: none; }
    #caption { bottom: auto; top: calc(9vh + 15vw); }
  }
</style>
</head>
<body>
<h1 id="headline">HELLO I'M VATSAL</h1>
<canvas id="stage"></canvas>
<div id="caption">
  <div class="tags"><span class="chip">AI/ML engineer</span><span>Rajkot, Gujarat</span></div>
  <p>I build models</p>
  <p>and the evals that check them.</p>
</div>
<div id="loading">LOADING</div>
<div id="credit">
  Shape sampled from <a href="https://sketchfab.com/3d-models/stargazing-through-the-attic-window-6b3e2a011f024ac6a6b123ed33d0ec28" target="_blank" rel="noopener">"Stargazing through the attic window"</a>
  by <a href="https://sketchfab.com/Moon_solstice" target="_blank" rel="noopener">Moon</a>,
  <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- settings ----------
const MODEL_URL = 'assets/girl.glb';
const MODEL_YAW = window.__yaw ?? 0;
const MODEL_PITCH = window.__pitch ?? 0.25;   // she looks up at the sky; tilt her face toward us
const BUDGET = { face: 0.38, hair: 0.42, body: 0.20 };   // share of particles per part
const COUNT   = innerWidth < 700 ? 50000 : 100000;  // particles
const CROP_Y  = 0.0;      // drop points below this height (model is normalised to height 1)
const POINT_SIZE = 5.2;   // bigger, overlapping beads: dense but not solid

// ---------- renderer / scene ----------
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 50);
const bust = new THREE.Group();
scene.add(bust);

let points = null, bounds = null;

// ---------- load + sample ----------
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
loader.load(MODEL_URL, (gltf) => {
  gltf.scene.updateMatrixWorld(true);

  // Bake every mesh into one geometry (position + normal only, plain floats)
  // so we can sample the whole figure at once.
  const getters = ['getX', 'getY', 'getZ', 'getW'];
  const parts = [];
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    const src = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry;
    const g = new THREE.BufferGeometry();
    for (const name of ['position', 'normal']) {
      const a = src.getAttribute(name);
      if (!a) continue;
      const out = new Float32Array(a.count * 3);
      for (let i = 0; i < a.count; i++)
        for (let c = 0; c < 3; c++) out[i * 3 + c] = a[getters[c]](i);
      g.setAttribute(name, new THREE.BufferAttribute(out, 3));
    }
    if (!g.getAttribute('normal')) g.computeVertexNormals();
    g.applyMatrix4(o.matrixWorld);
    g.userData.group = /face|pSphere/i.test(o.name) ? 'face' : /hair/i.test(o.name) ? 'hair' : 'body';
    parts.push(g);
  });

  // Normalise all parts the same way: bottom at y = 0, centred, height 1,
  // then turn and tilt her to face the camera.
  const all = mergeGeometries(parts);
  all.computeBoundingBox();
  const size = all.boundingBox.getSize(new THREE.Vector3());
  const c = all.boundingBox.getCenter(new THREE.Vector3());
  const M = new THREE.Matrix4()
    .multiply(new THREE.Matrix4().makeRotationX(MODEL_PITCH))
    .multiply(new THREE.Matrix4().makeRotationY(MODEL_YAW))
    .multiply(new THREE.Matrix4().makeScale(1 / size.y, 1 / size.y, 1 / size.y))
    .multiply(new THREE.Matrix4().makeTranslation(-c.x, -all.boundingBox.min.y, -c.z));
  parts.forEach((g) => g.applyMatrix4(M));

  // Sample each group with its own budget so the dense hair strands
  // don't drown out the face.
  const p = new THREE.Vector3(), n = new THREE.Vector3();
  const posArr = new Float32Array(COUNT * 3), nrmArr = new Float32Array(COUNT * 3), rnd = new Float32Array(COUNT);
  let k = 0;
  for (const [group, share] of Object.entries(BUDGET)) {
    const gs = parts.filter((g) => g.userData.group === group);
    if (!gs.length) continue;
    const sampler = new MeshSurfaceSampler(new THREE.Mesh(mergeGeometries(gs))).build();
    const target = Math.min(COUNT, k + Math.round(COUNT * share));
    let guard = 0;
    while (k < target && guard++ < COUNT * 20) {
      sampler.sample(p, n);
      if (p.y < CROP_Y) continue;
      posArr.set([p.x, p.y, p.z], k * 3);
      nrmArr.set([n.x, n.y, n.z], k * 3);
      rnd[k] = Math.random();
      k++;
    }
  }

  // Centre the bust: its bottom at y = 0.
  let minY = Infinity, maxY = -Infinity, maxX = 0;
  for (let i = 0; i < k; i++) {
    const y = posArr[i * 3 + 1];
    minY = Math.min(minY, y); maxY = Math.max(maxY, y); maxX = Math.max(maxX, Math.abs(posArr[i * 3]));
  }
  for (let i = 0; i < k; i++) posArr[i * 3 + 1] -= minY;
  bounds = { h: maxY - minY, w: maxX * 2 };

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(posArr.slice(0, k * 3), 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nrmArr.slice(0, k * 3), 3));
  geo.setAttribute('aRnd', new THREE.BufferAttribute(rnd.slice(0, k), 1));

  points = new THREE.Points(geo, makeMaterial());
  points.frustumCulled = false;
  bust.add(points);

  frame();
  document.getElementById('loading').style.opacity = 0;
}, undefined, (err) => {
  document.getElementById('loading').textContent = 'COULD NOT LOAD MODEL';
  console.error(err);
});

// ---------- the "symbiote" material ----------
// Everything moves on the GPU: a slow organic swell, ripples that spread
// from where the pointer has been (with warped, uneven wavefronts), and
// tendrils that reach toward the pointer and wobble back.
const MAX_RIPPLES = 12;
const ripples = Array.from({ length: MAX_RIPPLES }, () => new THREE.Vector4(0, 0, -100, 0)); // x, y, birth time, strength

const NOISE = /* glsl */`
  // 3D simplex noise (Ashima Arts / Stefan Gustavson, MIT)
  vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
  vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
  float snoise(vec3 v){
    const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
    vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
    vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
    vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
    i=mod289(i);
    vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
    float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
    vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
    vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
    vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
    vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
    vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
    vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
    vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
    p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
    vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
    return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
  }`;

function makeMaterial() {
  return new THREE.ShaderMaterial({
    transparent: false,
    depthWrite: true,
    uniforms: {
      uTime:    { value: 0 },
      uSize:    { value: 1 },
      uHeight:  { value: 1 },
      uPointer: { value: new THREE.Vector3(99, 99, 0) },
      uReach:   { value: 0 },        // 0..1, eases in while the pointer is over her
      uRipples: { value: ripples },
      uInk:     { value: new THREE.Color('#14111c') },
      uSheen:   { value: new THREE.Color('#b9b0d6') },
      uHot:     { value: new THREE.Color('#f1f7c4') },
    },
    vertexShader: /* glsl */`
      #define MAX_RIPPLES ${MAX_RIPPLES}
      uniform float uTime, uSize, uHeight, uReach;
      uniform vec3 uPointer;
      uniform vec4 uRipples[MAX_RIPPLES];
      attribute float aRnd;
      varying vec3 vNormalV;
      varying float vExcite, vY, vRnd;
      ${NOISE}
      void main() {
        vec3 p = position;
        vec3 nrm = normalize(normal);
        float excite = 0.0;

        // 1. slow, uneven swelling of the whole surface
        float swell = snoise(p * 3.0 + vec3(0.0, uTime * 0.15, uTime * 0.07));
        p += nrm * swell * 0.006;

        // 2. ripples from where the pointer passed; the wavefront is warped by
        //    noise so it never spreads as a clean circle
        for (int i = 0; i < MAX_RIPPLES; i++) {
          vec4 r = uRipples[i];
          float age = uTime - r.z;
          if (age < 0.0 || age > 3.0) continue;
          float warp = snoise(vec3(p.xy * 6.0, r.z)) * 0.07;
          float d = distance(p.xy, r.xy) + warp;
          float front = age * 0.32;
          float band = exp(-pow((d - front) * 14.0, 2.0));           // one moving ring
          float wave = sin((d - front) * 60.0) * band;
          float fade = exp(-age * 1.4) * r.w;
          p += nrm * wave * fade * 0.035;
          excite += abs(wave) * fade;
        }

        // 3. tendrils reaching toward the pointer: an irregular, noisy zone
        //    whose grains get pulled out and twisted
        vec2 toP = uPointer.xy - p.xy;
        float dist = length(toP);
        float edge = 0.11 + snoise(vec3(p.xy * 9.0, uTime * 0.6)) * 0.06;
        float grab = smoothstep(edge, 0.0, dist) * uReach;
        float strand = pow(max(snoise(vec3(p * 22.0) + uTime * 0.4), 0.0), 2.0);
        vec3 twist = vec3(
          snoise(p * 7.0 + vec3(uTime * 0.9, 0.0, 0.0)),
          snoise(p * 7.0 + vec3(0.0, uTime * 0.9, 3.1)),
          snoise(p * 7.0 + vec3(5.2, 0.0, uTime * 0.9)));
        p += (nrm * 0.07 + vec3(toP, 0.0) * 0.5 + twist * 0.03) * grab * (0.35 + strand * 2.2);
        excite += grab * (0.4 + strand);

        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vNormalV = normalize(normalMatrix * nrm);
        vExcite = clamp(excite, 0.0, 1.0);
        vY = position.y / uHeight;
        vRnd = aRnd;
        gl_PointSize = uSize * (0.55 + aRnd * 0.9) * (1.0 + vExcite * 0.4) / -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uInk, uSheen, uHot;
      varying vec3 vNormalV;
      varying float vExcite, vY, vRnd;
      void main() {
        // each grain is a little glossy bead: fake a sphere normal inside the point
        vec2 c = gl_PointCoord * 2.0 - 1.0;
        float r2 = dot(c, c);
        if (r2 > 1.0) discard;
        vec3 bead = vec3(c.x, -c.y, sqrt(1.0 - r2));
        vec3 n = normalize(vNormalV * 1.6 + bead);
        vec3 L = normalize(vec3(-0.4, 0.6, 0.7));
        vec3 V = vec3(0.0, 0.0, 1.0);
        float diff = max(dot(n, L), 0.0);
        float spec = pow(max(dot(reflect(-L, n), V), 0.0), 28.0);
        float rim = pow(1.0 - max(dot(vNormalV, V), 0.0), 2.5);
        vec3 col = uInk + uSheen * (diff * 0.34 + rim * 0.6) + vec3(spec) * 1.1;
        col = mix(col, uHot, vExcite * 0.55);
        // fade into the floor
        float fadeIn = smoothstep(0.0, 0.14, vY);
        if (fadeIn < 0.999 && vRnd > fadeIn) discard;
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
}

// ---------- framing ----------
function frame() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  if (bounds) {
    const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
    const fitH = bounds.h * 1.25 / 2 / Math.tan(halfFov);
    const fitW = bounds.w * (camera.aspect < 0.8 ? 1.1 : 1.6) / 2 / (Math.tan(halfFov) * camera.aspect);
    const dist = Math.max(fitH, fitW);
    const lookY = dist * Math.tan(halfFov) - bounds.h * 0.02;   // bottom of bust on the screen edge
    camera.position.set(0, lookY, dist);
    camera.lookAt(0, lookY, 0);
    points.material.uniforms.uSize.value = POINT_SIZE * renderer.getPixelRatio() * (h / 900) * (COUNT < 80000 ? 1.35 : 1);
    points.material.uniforms.uHeight.value = bounds.h;
  }
  camera.updateProjectionMatrix();
}
addEventListener('resize', () => { frame(); fitHeadline(); });
frame();

// Scale the headline so it spans ~94% of the width in whatever font loaded.
const headline = document.getElementById('headline');
function fitHeadline() {
  headline.style.fontSize = '100px';
  const w = headline.scrollWidth || 1;
  headline.style.fontSize = Math.min(240, (innerWidth * 0.94 / w) * 100) + 'px';
}
fitHeadline();
document.fonts?.ready.then(fitHeadline);

// ---------- pointer (mouse or touch) ----------
const ndc = new THREE.Vector2(9, 9);
let pointerActive = false;
const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
function setPointer(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  pointerActive = true;
}
addEventListener('pointermove', setPointer);
addEventListener('pointerdown', (e) => { setPointer(e); dropRipple(1.6); });
addEventListener('pointerleave', () => { pointerActive = false; });
addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') pointerActive = false; });

const pointer = new THREE.Vector3(99, 99, 0), lastDrop = new THREE.Vector3(99, 99, 0);
let rippleSlot = 0, lastDropTime = -1, now = 0;
function dropRipple(strength) {
  if (!points) return;
  ripples[rippleSlot].set(pointer.x, pointer.y, now, strength);
  rippleSlot = (rippleSlot + 1) % MAX_RIPPLES;
  lastDrop.copy(pointer); lastDropTime = now;
}

// ---------- render loop ----------
const clock = new THREE.Clock();
const hit = new THREE.Vector3();
let reach = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  now = clock.elapsedTime;

  if (points) {
    let over = false;
    if (pointerActive) {
      ray.setFromCamera(ndc, camera);
      if (ray.ray.intersectPlane(plane, hit)) {
        pointer.copy(hit);
        over = Math.abs(hit.x) < bounds.w * 0.6 && hit.y > 0 && hit.y < bounds.h * 1.05;
        // moving drops new ripples; faster movement = stronger, more frequent
        const moved = pointer.distanceTo(lastDrop);
        if (over && moved > 0.035 && now - lastDropTime > 0.06) dropRipple(Math.min(1.4, 0.5 + moved * 6));
      }
    }
    reach += ((over ? 1 : 0) - reach) * (1 - Math.exp(-dt * (over ? 3 : 1.2)));
    const u = points.material.uniforms;
    u.uTime.value = now;
    u.uReach.value = reach;
    u.uPointer.value.copy(pointer);
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
